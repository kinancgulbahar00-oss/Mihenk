# E-16 (7. rapor): Go net/http MaxBytesReader — sinir asildiginda yanit basligi esgudumsuz yazilir, islem
# cokebilir (11 Kasim 2026). Iki ayri ikili, iki ayri gerekce; kabuller KISA surelidir.
  - id: CVE-2026-97054
    paths:
      - "usr/bin/caddy"
    statement: >-
      caddy:2.11.9 (Go 1.27.3; duzeltme Go 1.27.4 ile derlenmis yeni bir Caddy imaji gerektiriyor). Vekil
      internete acik tek bilesendir ve request_body max_size etkilenen islevi kullanir; olasi etki vekil
      surecinin cokmesi, yani kisa sureli hizmet kesintisidir (kap 'restart: unless-stopped' ile yeniden
      baslar). Gizlilik ve butunluk etkisi yoktur. 7. rapordaki laboratuvar denemesinde sinir asan 58.000
      istekle (parcali aktarim, ardisik istekler, Expect: 100-continue) cokme tetiklenemedi. Go 1.27.4+ ile
      derlenmis Caddy imaji yayimlandiginda docker-compose.yml icindeki surum ve ozet guncellenmeli ve bu
      kayit silinmelidir. Yeniden degerlendirme: en gec 2026-12-11.
    expired_at: 2026-12-11
  - id: CVE-2026-97054
