# Bilincli ve SURELI risk kabulleri. Suresi dolan kayit yeniden derlemeyi basarisiz kilar.
vulnerabilities:
  - id: CVE-2026-78661
    paths:
      - "usr/bin/caddy"
    statement: >-
      caddy:2.11.9 (en guncel surum) icindeki golang.org/x/net/html; duzeltme 0.62.0 ile yeni bir
      Caddy surumu gerektiriyor. Vekil yalnizca reverse_proxy kullaniyor, HTML ayristiran
      modul (templates/markdown) yuklu degil. Yeni Caddy surumu cikinca Dependabot ile guncellenecek.
    expired_at: 2026-12-31

# Z-08: veritabani imajindaki gosu (Go stdlib) kayitlari. Kapsam yalnizca bu ikilidir.
  - id: CVE-2025-61726
    paths:
      - "usr/local/bin/gosu"
    statement: >-
      postgres:16.16-alpine (en guncel 16.x imaji) icindeki gosu ikilisi Go 1.24.6 standart
      kitapligiyla derlenmis. gosu yalnizca konteyner acilisinda giris betigi tarafindan bir kez
      calistirilir (root -> postgres kullanicisina gecis + exec); TLS, HTTP, URL, x509, XML veya
      MIME isleyen kod yoluna ve disaridan gelen veriye maruz kalmaz. Veritabani yalnizca ic agda
      (db_net, internal) ve salt okunur kok dosya sistemiyle, sinirli yeteneklerle calisir (Z-09).
      Yeni postgres imaji yayimlaninca Dependabot ile guncellenecek; tarih dolunca tarama yeniden basarisiz olur (Z-08).
    expired_at: 2026-12-31
