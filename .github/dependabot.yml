# Otomatik bagimlilik ve imaj guncellemeleri (Y-04).
# Dependabot, ozetle sabitlenmis imajlarda (image:tag@sha256:...) hem etiketi hem ozeti gunceller.
version: 2
updates:
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"
    labels: ["security", "dependencies"]

  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["security", "dependencies"]

  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    labels: ["security", "dependencies"]

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["security", "dependencies"]

  # Commit ozetiyle sabitlenmis eylemleri (uses: sahip/eylem@<ozet> # vX.Y.Z) de gunceller (Z-08)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["security", "dependencies"]
